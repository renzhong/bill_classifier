[feishu]
# 先填入你自己的飞书应用信息，然后执行:
# python3 feishu_login.py --config_file=config/config.ini
app_id=
app_secret=
user_access_token=
refresh_token=
token_expires_at=0
refresh_token_expires_at=0
scope=offline_access sheets:spreadsheet
user_open_id=
user_name=
bill_sheet_token=
# https://vgk5e2s4w1.feishu.cn/sheets/HwSRs3mvOhHUu6tY70mcFBnRnDe?sheet=125297
category_sheet_token=HwSRs3mvOhHUu6tY70mcFBnRnDe

[gpt]
# 调用限制；指定使用哪一个 [model.*] 作为当前模型
call_limit=-1
active_model=openai

# 每个 [model.*] 描述一个 OpenAI 兼容协议的模型调用配置
# section 名后缀（这里是 openai）即为 active_model 引用的名字
[model.openai]
base_url=https://api.openai.com/v1
model_name=gpt-4-turbo-2024-04-09
api_key=
# api_secret=  # 可选，如某些服务需要

